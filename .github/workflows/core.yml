name: Core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.affected.outputs.run }}
      code: ${{ steps.affected.outputs.code }}
      ui: ${{ steps.affected.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        run: ./x affected core
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./x core
        if: needs.changes.outputs.code == 'true'
      - name: Terminal integration
        if: runner.os != 'Windows' && needs.changes.outputs.ui == 'true'
        run: ./x ui gallery editor inline
  complete:
    name: Core - Build and Test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify affected platforms passed
        run: |
          test '${{ needs.changes.result }}' = success
          if [ '${{ needs.changes.outputs.run }}' = true ]; then
            test '${{ needs.test.result }}' = success
          else
            test '${{ needs.changes.outputs.run }}' = false
            test '${{ needs.test.result }}' = skipped
          fi
