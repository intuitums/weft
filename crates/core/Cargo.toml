[package]
name = "wove"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust library for building terminal user interfaces."
readme = "README.md"
documentation = "https://docs.rs/wove"
keywords = ["terminal", "tui", "elements", "layout"]
categories = ["command-line-interface"]

[features]
default = ["terminal"]
terminal = ["dep:crossterm", "dep:rustix", "dep:signal-hook"]
markdown = ["dep:pulldown-cmark"]
syntax = ["dep:syntect"]
diff = ["dep:similar"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
similar = { version = "3.2", optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
unicode-segmentation = "1.13"
unicode-width = "0.2"
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }

# Safe polling for terminal queries; crossterm already brings this crate in.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, default-features = false, features = ["std", "event", "stdio"] }
# Restores the terminal before a fatal signal; crossterm already brings this crate in.
signal-hook = { version = "0.3", optional = true }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["terminal"]

[[example]]
name = "inline"
path = "examples/inline.rs"
required-features = ["terminal"]

[[example]]
name = "timing"
path = "examples/timing.rs"
